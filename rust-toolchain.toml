# The one toolchain everything builds with, as the sibling Rust CLIs (docfit, stablehand, slimfit) pin it, with the target of each of the five platforms packaging/release.sh builds (the gate clippy-checks the Windows one).
[toolchain]
channel = "nightly-2026-10-22"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
