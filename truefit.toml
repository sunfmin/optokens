# optokens' ties to the real thing (`truefit --help`). Its tasks are filed as issues while the host is idle (factorium.toml's [idle]).
# Promises are decisions, so they live in ADRs; CLAUDE.md holds the repo's invariants.
[promises]
sources = ["CLAUDE.md", "docs/adr/*.md"]

# The promises the ADRs make. One a command not built yet will keep is kept
# until a date by which that command is due; its test is its check then.

[[promise]]
name = "one-json-object"
says = "Every command prints one JSON object on stdout; a failure is `{\"error\": …}` with a non-zero exit."
source = "docs/adr/0001-one-json-object-but-get-and-env.md:5"
check = ["test"]

[[promise]]
name = "get-and-env-errors-on-stderr"
says = "They send their errors to stderr and leave stdout empty on an error, so `$(…)` and `eval` never capture an error."
source = "docs/adr/0001-one-json-object-but-get-and-env.md:5"
check = ["test"]

[[promise]]
name = "no-process-reaches-1password"
says = "No `op`, and no child process reaches 1Password: `doctor` looks for no `op`, and neither the formula nor the Scoop manifest depends on one."
source = "docs/adr/0015-reach-1password-through-opcore.md:9"
check = ["test"]

[[promise]]
name = "no-value-in-argv-or-temp-file"
says = "Decision record 2's invariant stands: a secret's value is never in any process's command line and never in a file in plaintext."
source = "docs/adr/0015-reach-1password-through-opcore.md:13"
check = ["test"]

# The Copy (ADRs 0015 and 0019), kept by tests/secrets.rs and tests/init.rs on the stand-in Core.

[[promise]]
name = "reads-answer-from-the-copy-with-no-network"
says = "`list`, `get` and `env` answer from the Copy with no network, however old it is, except a `get` or `env` of a Secret the Copy lacks, which syncs once, or no Copy yet."
source = "docs/adr/0019-the-copy-syncs-on-demand.md:9"
check = ["test"]

[[promise]]
name = "reaches-1password-only-on-demand"
says = "optokens reaches 1Password only with `--fresh`, at a write (`put`, `rm`, `mv`), at a Secret the Copy lacks, or with no Copy yet: opcore's Copy on demand (`Syncs::OnDemand`, opcore's decision record 5)."
source = "docs/adr/0019-the-copy-syncs-on-demand.md:10"
check = ["test"]

[[promise]]
name = "a-write-syncs-first-and-reads-nothing-back"
says = "`put` and `rm` sync, then write once: the Copy keeps what the write answered, with no read back."
source = "docs/adr/0015-reach-1password-through-opcore.md:10"
check = ["test"]

[[promise]]
name = "a-sync-gets-only-what-changed"
says = "A Sync is one list and one batch get of the items that changed."
source = "docs/adr/0015-reach-1password-through-opcore.md:11"
check = ["test"]

[[promise]]
name = "untagged-title-refused"
says = "Its list also names the untagged items, kept in memory only, so a title one of them holds is still refused (`not_optokens`)."
source = "docs/adr/0015-reach-1password-through-opcore.md:11"
check = ["test"]

[[promise]]
name = "one-token-lookup"
says = "The token is `OP_SERVICE_ACCOUNT_TOKEN` when set, else `$XDG_CONFIG_HOME/optokens/token` (default `~/.config/optokens/token`). One function finds it, and every command calls it."
source = "docs/adr/0003-token-env-then-owner-only-file.md:5"
check = ["test"]

[[promise]]
name = "windows-token-dacl"
says = "Any other entry is refused, naming it and the `icacls` line that strips it (or `optokens init`, which writes the file with that DACL). Only the check differs by OS, behind one function."
source = "docs/adr/0003-token-env-then-owner-only-file.md:7"
kept = "there is no Windows host to run a test on; the gate only builds the Windows branch"
kept_until = "2027-05-31"

[[promise]]
name = "five-platforms"
says = "optokens is built for agent-cli's five platforms: macOS arm64 and x86_64, Linux arm64 and x86_64 (musl), and Windows x86_64 (msvc). There is no Windows host to run the tests on, so the gate checks the Windows build with clippy for `x86_64-pc-windows-msvc`, and a Windows-only branch cannot rot unbuilt."
source = "docs/adr/0004-five-platforms.md:5"
check = ["test"]

[[promise]]
name = "env-posix-exports"
says = "`env` prints `export NAME='value'` lines on every OS, for sh, bash and zsh, Git Bash and WSL on Windows included, as mytokens prints them (ADR 0001). There is no PowerShell form yet: `env --shell powershell` is added when someone needs it."
source = "docs/adr/0005-env-prints-posix-exports.md:3"
check = ["test"]

[[promise]]
name = "a-person-enters-on-a-link"
says = "`put --fields` and `init` print a one-time link and wait for its one submission, departing from agent-cli's \"never ask\": the owner's spec makes the link the way in for a secret a person knows, and there is no popup or terminal prompt to fall back on."
source = "docs/adr/0007-a-person-enters-a-value-on-a-one-time-link.md:5"
check = ["test"]

[[promise]]
name = "no-value-in-argv-or-temp-file-invariant"
says = "A secret's value is never in any process's argv and never written to a file in plaintext: optokens starts no process to reach 1Password (opcore runs its Core inside optokens, and `src/store.rs` is the one way to it), and the Copy, with its temporary file, is sealed."
source = "CLAUDE.md:8"
check = ["test"]

[[promise]]
name = "item-read-back-exactly"
says = "Reading an item back gives exactly the Secret that was stored."
source = "docs/adr/0009-one-item-per-secret-metadata-in-its-own-section.md:7"
check = ["test"]

[[promise]]
name = "foreign-item-refused"
says = "An item without the `optokens` tag, or whose `optokens` section is not this shape, is refused by name, never guessed at."
source = "docs/adr/0009-one-item-per-secret-metadata-in-its-own-section.md:7"
check = ["test"]

[[promise]]
name = "label-never-collides-with-metadata"
says = "Metadata in a section of its own: chosen, because a user's Field may be called `kind` or `description` (a Profile's environment variable); in its own section a label never collides with it."
source = "docs/adr/0009-one-item-per-secret-metadata-in-its-own-section.md:13"
check = ["test"]

# A Field's type in the vault (ADR 0011), kept by the tests of src/item.rs,
# src/secret.rs and tests/secrets.rs, tests/link.rs.

[[promise]]
name = "field-type-follows-how-it-came-in"
says = "Each field of the section `fields` has the type of the way its value came in: `STRING` for `--set` and a `--show` Field, `CONCEALED` for `--field-from-stdin`, a hidden link input and a bare `put`'s single value."
source = "docs/adr/0011-a-fields-type-follows-how-its-value-came-in.md:5"
check = ["test"]

[[promise]]
name = "field-type-read-and-merged"
says = "`read` takes each Field's type from its field, refusing any type but `STRING` and `CONCEALED`; `put` gives a Field it sets the type of the way it came in and keeps an unnamed Field's type, and writes nothing when neither value nor type changes."
source = "docs/adr/0011-a-fields-type-follows-how-its-value-came-in.md:14"
check = ["test"]

[[promise]]
name = "field-type-changes-nothing-given-out"
says = "The type changes only how 1Password shows a field: `get`, `env` and `list` give out the same as before. Items written when every value was `CONCEALED` read back as they are; nothing migrates them."
source = "docs/adr/0011-a-fields-type-follows-how-its-value-came-in.md:16"
check = ["test"]

# The one-time link's rules (ADR 0008), each kept by the tests of src/link/tests.rs.

[[promise]]
name = "link-token"
says = "A link's token is 128 bits from the OS's CSPRNG, written as 32 lowercase hex digits, and is the whole of its path; a request's path is compared with it in constant time."
source = "docs/adr/0008-the-one-time-links-rules.md:11"
check = ["test"]

[[promise]]
name = "link-one-submission"
says = "The first complete POST with the right token before expiry gives back the values, and no request after it does: each answers 410, \"This link was already used.\""
source = "docs/adr/0008-the-one-time-links-rules.md:13"
check = ["test"]

[[promise]]
name = "link-expires-in-ten-minutes"
says = "A link expires 10 minutes after it is made, one constant that the code and the page say; from then on each request answers 410, \"This link expired. Nothing was stored.\""
source = "docs/adr/0008-the-one-time-links-rules.md:15"
check = ["test"]

[[promise]]
name = "link-lifetime-in-help"
says = "The help of `put` and `init` says it from that constant too."
source = "docs/adr/0008-the-one-time-links-rules.md:15"
check = ["test"]

[[promise]]
name = "link-refusals"
says = "A wrong path answers 404 and a method other than GET or POST 405; a POST with an empty field answers the form again, 400, with \"Every field needs a value.\""
source = "docs/adr/0008-the-one-time-links-rules.md:17"
check = ["test"]

[[promise]]
name = "link-page"
says = "The page names the Secret (`<service>/<account>`) and its Description, and has one input per Field it asks for: plain text for a `--show` Field, a password input for the rest; a Field already set shows only \"already set\", its value never on the page, and every piece of text on it is HTML-escaped."
source = "docs/adr/0008-the-one-time-links-rules.md:19"
check = ["test"]

[[promise]]
name = "link-tailnet-only"
says = "The link listens only on the tailnet address `tailscale ip` names that is on one of this host's interfaces; with no `tailscale` or no such address it stores nothing, and its refusal names what is missing."
source = "docs/adr/0008-the-one-time-links-rules.md:21"
check = ["test"]

[[promise]]
name = "link-https-or-http-with-why"
says = "With a certificate from `tailscale cert` the link is HTTPS; when `tailscale cert` fails it is plain HTTP on the tailnet, and the reason printed with it gives the error and the fix: an admin runs `sudo tailscale set --operator=<user>`, and HTTPS Certificates are on for the tailnet."
source = "docs/adr/0008-the-one-time-links-rules.md:23"
check = ["test"]

# Kept by tests/budget.rs, which asserts each command's calls and Budget and fails when docs/budget.md is stale.
[[promise]]
name = "commands-budget-recorded"
says = "Every command's scenario on the stand-in Core asserts its Core calls and the reads, writes and account requests they spend, and `docs/budget.md` is their table: `tests/budget.rs` generates it, fails when it is stale, and `UPDATE_BUDGET=1` rewrites it."
source = "docs/adr/0018-every-commands-budget-is-recorded.md:7"
check = ["test"]
